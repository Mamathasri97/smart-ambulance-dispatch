<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Ambulance Dispatch Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 30px; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #d9534f; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #333; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { background: #d9534f; color: white; padding: 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #c9302c; }
        #result { margin-top: 25px; padding: 20px; border-radius: 8px; display: none; }
        .success { background: #e8f8f5; color: #27ae60; border: 1px solid #27ae60; }
        .error { background: #fdedec; color: #c0392b; border: 1px solid #c0392b; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚨 Smart Ambulance Dispatch</h1>
    
    <form id="dispatchForm">
        <div class="form-group">
            <label>Patient Name</label>
            <input type="text" id="patient_name" required placeholder="Enter patient name">
        </div>

        <div class="form-group">
            <label>Contact Phone</label>
            <input type="text" id="phone" required placeholder="Enter contact number">
        </div>

        <div class="form-group">
            <label>Pickup Location</label>
            <select id="pickup_location_id" required></select>
        </div>

        <div class="form-group">
            <label>Target Hospital</label>
            <select id="hospital_id" required></select>
        </div>

        <button type="submit">Dispatch Nearest Ambulance</button>
    </form>

    <div id="result"></div>
</div>

<script>
    const API_BASE = 'http://127.0.0.1:5000/api';

    async function loadStatus() {
        try {
            const res = await fetch(`${API_BASE}/system-status`);
            const data = await res.json();

            const pickupSelect = document.getElementById('pickup_location_id');
            const hospitalSelect = document.getElementById('hospital_id');

            pickupSelect.innerHTML = data.locations.map(l => `<option value="${l.location_id}">${l.name}</option>`).join('');
            hospitalSelect.innerHTML = data.hospitals.map(h => `<option value="${h.hospital_id}">${h.name}</option>`).join('');
        } catch (err) {
            console.error('Failed to load locations/hospitals:', err);
        }
    }

    document.getElementById('dispatchForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const payload = {
            patient_name: document.getElementById('patient_name').value,
            phone: document.getElementById('phone').value,
            pickup_location_id: document.getElementById('pickup_location_id').value,
            hospital_id: document.getElementById('hospital_id').value
        };

        const res = await fetch(`${API_BASE}/dispatch`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const resultDiv = document.getElementById('result');
        const data = await res.json();

        resultDiv.style.display = 'block';
        if(res.ok) {
            resultDiv.className = 'success';
            resultDiv.innerHTML = `
                <h3 style="margin-top:0;">✅ Dispatch Confirmed!</h3>
                <p><strong>Assigned Vehicle:</strong> ${data.ambulance_id}</p>
                <p><strong>Calculated Route (Location IDs):</strong> ${data.route_path.join(' ➔ ')}</p>
                <p><strong>Estimated Arrival Time:</strong> ${data.estimated_time_mins} minutes</p>
            `;
        } else {
            resultDiv.className = 'error';
            resultDiv.innerHTML = `<h3 style="margin-top:0;">❌ Dispatch Failed</h3><p>${data.error}</p>`;
        }
    });

    loadStatus();
</script>

</body>
</html>
